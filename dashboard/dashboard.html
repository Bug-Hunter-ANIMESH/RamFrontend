<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | DailyForge</title>
  <link rel="stylesheet" href="dashboard.css">

  <style>
    /* 🔹 Full-screen loader */
    .full-loader {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .full-loader .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid #fff;
      border-top-color: #00eaff;
      border-radius: 50%;
      animation: spin 1s infinite linear;
    }

    /* 🔹 Inline loader for task list */
    .inline-loader {
      display: none;
      text-align: center;
      margin-top: 20px;
    }
    .inline-loader div {
      width: 45px;
      height: 45px;
      border: 4px solid #00f2ff;
      border-top-color: transparent;
      border-radius: 50%;
      margin: auto;
      animation: spin 0.9s infinite linear;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<script>
  if (!sessionStorage.getItem("dailyforgeToken")) {
    window.location.replace("login.html");
  }
</script>

<body>
  <!-- 🔥 FULL-SCREEN LOADER -->
  <div class="full-loader" id="fullLoader">
    <div class="spinner"></div>
  </div>

  <div class="background">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>

  <header>
    <h1>DailyForge Dashboard</h1>
    <p class="tagline">Forge your discipline. Plan. Prioritize. Perform.</p>
  </header>

  <div class="date-scroll" id="dateScroll"></div>

  <section class="task-section">
    <div class="task-form">
      <h2>Add New Task</h2>
      <form id="taskForm">
        <input type="text" id="taskTitle" placeholder="Task title" required />
        <textarea id="taskDesc" placeholder="Task description..." rows="2"></textarea>

        <label>Select Date</label>
        <input type="date" id="taskDate" required />

        <div class="time-inputs">
          <label>Start:</label>
          <input type="time" id="startTime" required />
          <label>End:</label>
          <input type="time" id="endTime" required />
        </div>

        <button type="submit" class="add-btn">+ Add Task</button>
        <button onclick="logoutUser()" type="button" class="add-btn logout-btn">
          Logout
        </button>
      </form>
    </div>

    <div class="task-list">
      <h2 id="taskListTitle">Tasks for Today</h2>

      <!-- 🔹 Inline loader -->
      <div class="inline-loader" id="inlineLoader">
        <div></div>
        <p>Loading tasks...</p>
      </div>

      <ul id="taskContainer"></ul>
    </div>
  </section>

  <script>
    function logoutUser() {
      sessionStorage.removeItem("dailyforgeToken");
      sessionStorage.removeItem("userid");
      alert("You’ve been logged out!");
      window.location.href = "../login/login.html";
    }
  </script>

  <script src="dashboard.js"></script>
</body>
</html>
